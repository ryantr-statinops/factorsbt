[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factorsbt"
version = "0.1.0"
description = "Python SDK and command line client for the FactorsBT local backend"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
factorsbt = "factorsbt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
