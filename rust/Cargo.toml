[workspace]
members = ["crates/backend", "crates/contracts", "crates/engine"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
